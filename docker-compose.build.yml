# Build SinkDuce from source in this repository (paths unchanged: src/, frontend/, …).
#
# From repo root:
#   docker compose -f docker-compose.build.yml up -d --build
#   SINKDUCE_EDITION=enterprise docker compose -f docker-compose.build.yml up -d --build
#
# Nested under a deploy folder (share parent data/):
#   SINKDUCE_DATA=../data docker compose -f docker-compose.build.yml up -d --build
#
# Default “pull image only” stack: docker-compose.yml

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes:
      - ${SINKDUCE_DATA:-./data}/qdrant:/qdrant/storage
    entrypoint: ["/bin/sh", "-c", "find /qdrant/storage -name .DS_Store -delete 2>/dev/null; exec ./entrypoint.sh"]
    environment:
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
      - QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER=1

  app:
    build:
      context: .
      # Community is the default. Enterprise needs the explicit build target.
      target: ${SINKDUCE_EDITION:-community}
      additional_contexts:
        enterprise_source: ./ee
      args:
        # Defaults match Dockerfile (Docker Hub). CI relies on these.
        # Local CN mirror (optional .env):
        #   NODE_IMAGE=docker.1ms.run/library/node:20-slim
        #   PYTHON_IMAGE=docker.1ms.run/library/python:3.11-slim
        NODE_IMAGE: ${NODE_IMAGE:-node:20-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.6.14}
    ports:
      # 本机入口：只发布到宿主机回环（本机同源静默领钥匙，远端够不到）。
      - "127.0.0.1:${API_PORT:-18900}:18900"
      # 对外（局域网）入口：其他设备经它访问，需配对钥匙。
      - "${EXTERNAL_PORT:-18901}:${EXTERNAL_PORT:-18901}"
    volumes:
      - ${SINKDUCE_DATA:-./data}:/app/data
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - SINKDUCE_CONTAINER=1
      - SINKDUCE_EXTERNAL_PORT=${EXTERNAL_PORT:-18901}
      # 远程模式（瘦壳）：.env 里 SINKDUCE_REMOTE_MODE=1 时，容器只跑
      # 前端壳 + MCP Hub，不连 Qdrant、不加载模型。UI 只显示当前模式，
      # 修改要去 .env 改完重新 compose up -d。
      - SINKDUCE_REMOTE_MODE=${SINKDUCE_REMOTE_MODE:-0}
      - HF_HOME=/app/data/models
      - MODELSCOPE_CACHE=/app/data/models
    depends_on:
      - qdrant
    restart: unless-stopped
