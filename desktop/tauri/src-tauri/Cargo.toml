[package]
name = "sinkduce-desktop"
version = "1.6.1"
description = "SinkDuce native macOS shell"
authors = ["SinkDuce"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
url = "2"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
