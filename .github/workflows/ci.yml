name: CI

on:
  push:
    # feature/* included (e.g. feature/file-management-v2); feat/* keeps short names
    branches: [feat/**, feature/**, fix/**, chore/**, codex/**]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build
    env:
      # Never use CN-only mirrors on GHA (docker.1ms.run often 403s on blob fetch).
      NODE_IMAGE: node:20-slim
      PYTHON_IMAGE: python:3.11-slim
      UV_IMAGE: ghcr.io/astral-sh/uv:0.6.14
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect community image
        run: |
          docker build --target community -t sinkduce-ce-ci .
          docker save sinkduce-ce-ci | python3 scripts/check_community_artifact.py image-stream
          docker run --rm --entrypoint python sinkduce-ce-ci -c 'from src.main import app; from src.edition import has_permission_management, is_enterprise; p=app.openapi()["paths"]; assert not is_enterprise(); assert has_permission_management(); assert "/api/identity/roles" in p; assert "/api/identity/domain-acl" in p; assert "/api/pairing/set-role" in p'
      - name: Build enterprise image without publishing it
        run: |
          docker build --target enterprise -t sinkduce-ee-ci .
          docker run --rm --entrypoint python sinkduce-ee-ci -c 'from src.main import app; p=app.openapi()["paths"]; assert "/api/identity/roles" in p; assert "/api/pairing/set-role" in p'

  pytest:
    runs-on: ubuntu-latest
    name: Python Tests (informational)
    continue-on-error: true  # soft gate — integration tests need API server not available in CI
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        # Skip [diarization] to avoid pulling torch (~2GB) in CI
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  permission-tests:
    runs-on: ubuntu-latest
    name: Edition Permission Tests
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Community permissions
        run: SINKDUCE_EDITION=community python -m pytest -q tests/test_full_community.py tests/test_community_artifacts.py tests/test_open_core_community.py tests/test_edition_migration.py tests/test_identity_rbac.py tests/test_identity_api.py tests/test_pairing.py tests/test_pairing_set_role.py
      - name: Enterprise permissions
        run: SINKDUCE_EDITION=enterprise python -m pytest -q tests/test_identity_rbac.py tests/test_identity_api.py tests/test_pairing.py tests/test_pairing_set_role.py
      - name: Community Python wheel contains retained management modules
        run: |
          mkdir -p development_doc/wheel-check
          python -m pip wheel --no-deps . -w development_doc/wheel-check
          python scripts/check_community_artifact.py wheel development_doc/wheel-check/sinkduce-*.whl

  tsc:
    runs-on: ubuntu-latest
    name: TypeScript Check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build community frontend and inspect it
        working-directory: frontend
        run: |
          pnpm build
          python3 ../scripts/check_community_artifact.py tree .. --frontend-only
          pnpm exec node --test tests/community-permissions.test.ts
      - name: Typecheck and build enterprise frontend
        working-directory: frontend
        run: |
          pnpm exec tsc -p tsconfig.enterprise.json --noEmit
          SINKDUCE_EDITION=enterprise pnpm build
