name: CI

on:
  push:
    # feature/* included (e.g. feature/file-management-v2); feat/* keeps short names
    branches: [feat/**, feature/**, fix/**, chore/**]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build
    env:
      # Never use CN-only mirrors on GHA (docker.1ms.run often 403s on blob fetch).
      NODE_IMAGE: node:20-slim
      PYTHON_IMAGE: python:3.11-slim
      UV_IMAGE: ghcr.io/astral-sh/uv:0.6.14
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose build

  pytest:
    runs-on: ubuntu-latest
    name: Python Tests (informational)
    continue-on-error: true  # soft gate — integration tests need API server not available in CI
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        # Skip [diarization] to avoid pulling torch (~2GB) in CI
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  tsc:
    runs-on: ubuntu-latest
    name: TypeScript Check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit
