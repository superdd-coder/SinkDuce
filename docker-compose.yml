# Default: pull pre-built image from Docker Hub (no local source build).
#
#   docker compose pull && docker compose up -d
#   open http://localhost:18900
#   UI → Download local models (fetches GitHub Release ONNX pack)
#
# To build from this repository instead:
#   docker compose -f docker-compose.build.yml up -d --build
#
# Nested layout (optional):
#   my-sinkduce/
#     docker-compose.yml      ← this file
#     data/
#     SinkDuce-build/         ← git clone of this repo
#   Then from SinkDuce-build:
#     SINKDUCE_DATA=../data docker compose -f docker-compose.build.yml up -d --build

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes:
      - ${SINKDUCE_DATA:-./data}/qdrant:/qdrant/storage
    entrypoint: ["/bin/sh", "-c", "find /qdrant/storage -name .DS_Store -delete 2>/dev/null; exec ./entrypoint.sh"]
    environment:
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
      - QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER=1

  app:
    image: ${SINKDUCE_IMAGE:-jethrohou/sinkduce}:${SINKDUCE_IMAGE_TAG:-latest}
    pull_policy: ${SINKDUCE_PULL_POLICY:-always}
    ports:
      - "${API_PORT:-18900}:18900"
    volumes:
      - ${SINKDUCE_DATA:-./data}:/app/data
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - HF_HOME=/app/data/models
      - MODELSCOPE_CACHE=/app/data/models
    depends_on:
      - qdrant
    restart: unless-stopped
